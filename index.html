<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewtForce</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      margin-bottom: 48px;
    }

    .tagline {
      font-size: 15px;
      color: #888;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 14px;
      text-align: center;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .card {
      flex: 1;
      min-width: 220px;
      background: #1a1b1b;
      border: 1px solid #2a2b2b;
      border-radius: 16px;
      padding: 32px 24px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: border-color 0.18s, background 0.18s, transform 0.18s;
      cursor: pointer;
    }

    .card:hover {
      border-color: #F05322;
      background: #1f1f1f;
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .card-sub {
      font-size: 13px;
      color: #777;
      text-align: center;
    }

    .card-arrow {
      margin-top: 12px;
      color: #F05322;
      font-size: 20px;
    }

    footer {
      margin-top: 56px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="logo">
    <svg width="110" height="71" viewBox="0 0 122 79" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 3V76C0 77.6569 1.34315 79 3 79H16C17.6569 79 19 77.6569 19 76V27.6076C19 27.1168 19.6334 26.9197 19.9118 27.324L54.6058 77.7016C55.1656 78.5145 56.0895 79 57.0766 79H77.5C79.1569 79 80.5 77.6569 80.5 76V20.5C80.5 18.8431 81.8431 17.5 83.5 17.5H118.5C120.157 17.5 121.5 16.1569 121.5 14.5V3C121.5 1.34315 120.157 0 118.5 0H63.5C61.8431 0 60.5 1.34315 60.5 3V49.3878C60.5 49.879 59.8657 50.0757 59.5877 49.6707L26.3939 1.30247C25.8344 0.487216 24.9091 0 23.9203 0H3C1.34315 0 0 1.34314 0 3Z" fill="#fff"/>
      <path d="M117 54.0917V43C117 41.3431 115.657 40 114 40H106.606C104.209 40 102.78 42.6704 104.109 44.6641L111.504 55.7558C113.15 58.2255 117 57.0599 117 54.0917Z" fill="#F05322"/>
    </svg>
    <p class="tagline">Assessment Platform</p>
  </div>

  <div class="cards">
    <a class="card" href="https://coach.newtforceapp.com">
      <div class="card-icon">📋</div>
      <div class="card-title">I'm a Coach</div>
      <div class="card-sub">Upload sessions, view athlete data, generate reports</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="https://player.newtforceapp.com">
      <div class="card-icon">⚾</div>
      <div class="card-title">I'm a Player</div>
      <div class="card-sub">Book sessions, view your assessments and progress</div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <footer>© 2025 NewtForce. All rights reserved.</footer>

</body>
</html>
